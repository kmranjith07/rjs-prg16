name: Deploy Program 16 to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build React Application
        run: npm run build

      - name: Find Build Folder
        id: output
        run: |
          if [ -f dist/index.html ]; then
            echo "path=dist" >> "$GITHUB_OUTPUT"
          elif [ -f build/index.html ]; then
            echo "path=build" >> "$GITHUB_OUTPUT"
          else
            echo "Error: index.html not found in dist or build"
            exit 1
          fi

      - name: Create SPA 404 Page
        run: cp "${{ steps.output.outputs.path }}/index.html" "${{ steps.output.outputs.path }}/404.html"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
